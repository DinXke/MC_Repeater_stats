name: MeshCore Proxy
version: "1.0.0"
slug: mc_proxy
description: >-
  TCP-fanout-proxy: laat meerdere companions (Home Assistant-integratie,
  MeshCore-app, meshcore-cli) tegelijk één WiFi-node delen.
url: https://github.com/DinXke/MC_Repeater_stats
arch:
  - amd64
  - aarch64
  - armv7
startup: services
boot: auto
init: false
host_network: true
options:
  node_host: "192.168.110.160"
  node_port: 5000
  listen_port: 5000
schema:
  node_host: str
  node_port: port
  listen_port: port
